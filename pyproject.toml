[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "siac"
version = "2.0.0"
description = "Sensor-Invariant Atmospheric Correction (SIAC) - A modular framework for atmospheric correction of satellite imagery"
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Feng Yin", email = "ucfafyi@ucl.ac.uk" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
keywords = ["atmospheric-correction", "remote-sensing", "sentinel-2", "landsat", "radiative-transfer"]

dependencies = [
    # Core geospatial
    "xarray>=2024.1.0",
    "rioxarray>=0.15.0",
    "rasterio>=1.3.0",
    "pyproj>=3.6.0",

    # Scientific computing
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "scikit-image>=0.22.0",
    "duckdb>=1.1.0",
    "pyarrow>=10.0.0",
    "openpyxl>=3.1.0",
    "spectral-library>=0.2.0",
    "RSRF>=0.0.1",

    # ML for cloud detection
    "lightgbm>=4.0.0",
    "omnicloudmask>=1.7.0",

    # Configuration & validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",

    # HTTP & data access
    "requests>=2.31.0",
    "aiohttp>=3.13.3",
    "fsspec>=2024.2.0",
    "zarr>=2.17.0",
    "h5py>=3.10.0",
    "pyhdf>=0.11.6",
    "h5netcdf>=1.3.0",
    "earthaccess>=0.16.0",
    "cdsapi>=0.7.7",

    # Utilities
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.98.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
]
gee = [
    "earthengine-api>=0.1.390",
]
py6s = [
    "Py6S>=1.9.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]
all = [
    "siac[dev,gee,py6s,docs]",
]

[project.urls]
Homepage = "https://github.com/MarcYin/SIAC"
Documentation = "https://siac.readthedocs.io"
Repository = "https://github.com/MarcYin/SIAC"
Issues = "https://github.com/MarcYin/SIAC/issues"

[project.scripts]
siac = "siac.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "siac._rust"
include = [{ path = "siac/adapters/output.py", format = ["sdist", "wheel"] }]

# ============================================================================
# pytest configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
pythonpath = ["python"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=python/siac",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-report=json:coverage.json",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "regression: marks tests as regression tests requiring golden outputs",
    "gee: marks tests requiring Google Earth Engine access",
    "py6s: marks tests requiring Py6S installation",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# coverage configuration
# ============================================================================
[tool.coverage.run]
source = ["python/siac"]
omit = [
    "*/tests/*",
    "*/_rust/*",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
]
fail_under = 95
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# mypy configuration
# ============================================================================
[tool.mypy]
python_version = "3.10"
mypy_path = "python"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "rasterio.*",
    "rioxarray.*",
    "lightgbm.*",
    "scipy.*",
    "skimage.*",
    "sklearn.*",
    "h5py.*",
    "zarr.*",
    "Py6S.*",
    "ee.*",
]
ignore_missing_imports = true

# ============================================================================
# ruff configuration (linting & formatting)
# ============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["python/siac", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "PTH",   # flake8-use-pathlib
    "NPY",   # NumPy-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["siac"]
