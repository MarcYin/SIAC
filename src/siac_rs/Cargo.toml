[package]
name = "siac_rs"
version = "0.1.0"
edition = "2021"
authors = ["Feng Yin <ucfafyi@ucl.ac.uk>"]
description = "Rust performance extensions for SIAC atmospheric correction"
license = "AGPL-3.0"
repository = "https://github.com/MarcYin/SIAC"

[lib]
name = "siac_rs"
crate-type = ["cdylib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"

# Numerical computing
ndarray = { version = "0.15", features = ["rayon"] }
ndarray-stats = "0.5"
nalgebra = "0.32"

# Parallelism
rayon = "1.8"

# Fast math
num-traits = "0.2"

[dev-dependencies]
criterion = "0.5"
approx = "0.5"

[[bench]]
name = "kernels"
harness = false

[lints.rust]
unused_must_use = "deny"
# Note: `rust_2018_idioms` is intentionally NOT enabled because the existing
# PyO3 0.20 signatures use `<'py>` lifetimes that would trigger its
# `elided_lifetimes_in_paths` check throughout the crate. Revisit when the
# crate upgrades to PyO3 0.21+.

[lints.clippy]
# Baseline lint levels — escalate only the ones that catch real bugs.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# PyO3 entry points mirror the Python API and intentionally carry wide argument
# lists / tuple returns at the boundary.
too_many_arguments = "allow"
type_complexity = "allow"
# Pedantic is noisy — keep it opt-in per module if/when we want it.
pedantic = { level = "allow", priority = -2 }
