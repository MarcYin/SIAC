site_name: SIAC
site_description: Sensor-Invariant Atmospheric Correction documentation
site_url: https://marcyin.github.io/SIAC/
repo_url: https://github.com/MarcYin/SIAC
repo_name: MarcYin/SIAC
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

exclude_docs: |
  _build/
  EARTHACCESS_PLAN.md
  PLANS.md
  PLANS_CLOUD_MASK.md
  PLANS_S2.md
  REVIEW_AND_RECOMMENDATIONS.md
  TEST_PLAN.md
  code_structure.md
  config-redesign.md
  naming-conventions.md
  siac-config.example.toml

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts/overview.md
      - Glossary: concepts/glossary.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Run: getting-started/first-run.md
  - User Guide:
      - Configuration Basics: user-guide/configuration-basics.md
      - Native 6SV2.1 Backend: user-guide/native-sixs-backend.md
      - RT Model Differences: user-guide/rt-model-differences.md
      - Running SIAC: user-guide/running-siac.md
      - Outputs: user-guide/outputs.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Science:
      - Theory: science/theory.md
      - Priors and Mapping: science/priors-and-mapping.md
      - Paper Companion: science/paper-companion.md
      - Validation and Limitations: science/validation-and-limitations.md
  - Reference:
      - Configuration: reference/configuration.md
      - Public API: reference/public-api.md
  - Architecture:
      - Package Map: architecture/package-map.md
      - Execution Flow: architecture/execution-flow.md
      - Data Flow: architecture/data-flow.md
      - Native 6SV2.1 Backend: architecture/native-sixs-backend.md
      - Rust Integration: architecture/rust-integration.md
  - Developer:
      - Dev Setup: developer/dev-setup.md
      - Extending SIAC: developer/extending-siac.md
