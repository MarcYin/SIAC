# SIAC surface-driven aerosol-retrieval configuration (opt-in, validated stack).
#
# This selects the validated ~85% within-EE Sentinel-2 AOD path:
#   - surface prior built by the external `bestpixel` package (L2A best-pixel
#     composites with a MAIAC low-AOD day gate) + per-band temporal-RMSE
#     uncertainty,
#   - the AOD-grid `surface_driven` solver with the calibrated loose backstop,
#   - a MAIAC (MCD19) atmospheric prior as the loose aerosol backstop.
#
# It is OPT-IN: the package defaults remain `kernel_model` + `multigrid`. Point a
# run at this file to use the surface-driven stack. Requires `bestpixel>=0.3.0`
# (pip install 'siac[bestpixel]'). Stable machine settings only — keep per-run
# AOI / scene / output paths out of this file.

[paths]
# Sea-level (0 km) RT elevation — the "none" sentinel skips the DEM read (see
# siac.geo.dem.use_sea_level_elevation). The surface-driven cost cube was
# validated at the harness reference atmosphere (sea-level + TCWV=2.0, below);
# real per-pixel DEM elevation un-masks the surface prior's blue dark bias and
# drives AOD over-retrieval at altitude. To restore physical DEM elevation point
# this at the Copernicus GLO-30 VRT:
# dem = "/vsicurl/https://raw.githubusercontent.com/MarcYin/Copernicus_GLO_30_DEM_VRT/refs/heads/main/copernicus_GLO_30_dem.vrt"
dem = "none"
water_mask = "https://zenodo.org/records/14899246/files/landWater2020.vrt?download=1"
cache_root = "/data/siac/cache"

[runtime]
log_level = "INFO"
n_jobs = -1
chunk_size = 1024

[runtime.execution]
backend = "thread"
max_workers = 4

# MAIAC (MCD19) atmospheric prior — the LOOSE aerosol backstop the surface-driven
# solver widens per AOD regime. (CAMS also works; MAIAC matches the validated run.)
[providers.atmo]
kind = "mcd19"
cache_dir = "/data/siac/cache/atmo"
# Decode the AOD_QA bit field and keep only best-quality MAIAC pixels (clear +
# best + no-adjacency), matching the validated maiac_qa recipe. The default loose
# "QA > 0" filter reads systematically high at clean-coastal/polar sites (~0.63 vs
# ~0.54) and the backstop anchors to it. (Default off to preserve the multigrid prior.)
maiac_best_quality_qa = true

[providers.brdf]
kind = "mcd43"
temporal_window = 16
cache_dir = "/data/siac/cache/brdf"

# bestpixel composite settings read by the surface-prior method below. The
# `bestpixel` surface-prior method calls bestpixel directly (it does NOT go
# through a monthly-composite provider), but reuses these knobs.
[providers.monthly_composites]
kind = "bestpixel"
bestpixel_endpoint = "pc"          # Planetary Computer. MEASURED BETTER than earth-search on the
                                   # full-62 (pc 77.4% vs earth-search 72.6%): the earth-search source
                                   # flips a few high-AOD sites (e.g. Chiang_Mai) but is net-WORSE — a
                                   # per-site wash. The composite source is NOT a lever to >=85%.
# For a Sentinel-2-only HLS counterpart use:
# bestpixel_endpoint = "hls-s30"   # Planetary Computer HLS S30 only. The plain "hls" endpoint is mixed L30+S30.
bestpixel_lookback_years = 5       # lookback years of the seasonal window below
bestpixel_seasonal_window_months = 1  # scene month +/-1 (Apr-Jun for a May scene): 3 months x 5
                                   # years = 15 realizations, matching the comp_ref harness
                                   # (0 = scene month only = 5 realizations -> noisier median/unc)
bestpixel_top_k = 3
bestpixel_max_cloud_cover = 90.0
bestpixel_disk_cache = "/data/siac/cache/bestpixel"

[providers.s2]
backend = "cdse"
cache_dir = "/data/siac/cache/s2"
processing_level = "L1C"
max_cloud_cover = 100.0

[algorithms.cloud_mask]
mode = "auto"
provider = "omnicloudmask"
target_resolution_m = 10.0

# Bestpixel-backed surface prior: median across the LOYO monthly realizations =
# prior reflectance; robust MAD across them = per-band boa_unc (self-calibrating).
[algorithms.surface_prior]
method = "bestpixel"
bestpixel_source = "l2a"           # "l2a" Sen2Cor (no GEE). "l1c" not yet wired.
# For the HLS S30 counterpart set bestpixel_source = "hls-s30".
bestpixel_window_reduction = "daily_median"  # harness-style: clean days -> daily top-1 -> monthly median
bestpixel_low_aod_frac = 0.6       # MAIAC day gate: keep the cleanest 60% of days
# bestpixel_aod_max = 0.4          # absolute gate alternative to the fraction
bestpixel_robust_clip = 1.5        # validated: sigma-clip realizations to 1.5*MAD before median+MAD

[algorithms.surface_prior.spectral_mapping]
enabled = true
k_neighbors = 5
knn_backend = "scipy_ckdtree"

[algorithms.rt]
backend = "lut"
fallback_to_lut = true

# AOD-grid surface-driven solver: per-pixel argmin over the AOT axis of the
# surface-prior mismatch + calibrated MAIAC backstop, spatially median-pooled.
[algorithms.solver]
method = "surface_driven"
aerosol_resolution = 60.0          # 60m beat 120m on the high-AOD subset (Napoli IN at 60m)
grid_search_aot_points = 11        # log-spaced AOT nodes (only used when aot_axis="log")
surface_driven_backstop_calibrated = true
surface_driven_reference_tcwv = 2.0  # cost-cube RT at the validated reference atmosphere (with sea-level dem above)
surface_driven_scene_mean_geometry = true  # evaluate cost-cube RT at AOI-mean geometry (matches harness)
# Resolve on the surface prior's NATIVE (composite) grid instead of a fresh grid
# built from the observation bounds. CORRECTNESS / ROBUSTNESS option, NOT an EE
# lever: it removes a ~3% sub-pixel composite-vs-obs-bounds prior smear and fixes
# a latent cloud-mask footprint misalignment, but at matched resolution the solve
# is EE-neutral (single-site Lahore: native@60m == obs-bounds@60m within ~3%). The
# real lever is the 60m aerosol_resolution above, NOT the grid registration (a
# coarser obs-bounds@120m is what shifts the retrieval). Default off; the
# validated preset was measured with it off. Enable for maximal spatial fidelity.
surface_driven_resolve_on_prior_grid = false
surface_driven_pool_radius_m = 600.0
water_mask_buffer_pixels = 32
# Validated L2A 85.5% recipe (surface-driven scoped; multigrid unaffected):
surface_driven_solve_bands = ["B01", "B02", "B04"]   # add 443nm deep-blue B01 (deepens AOD signal)
surface_driven_cost_mode = "auto2"  # shape (moderate band) + absolute (clean/high tails)
surface_driven_aot_axis = "acixthree"  # fine non-uniform AOT axis (denser at low AOD)
surface_driven_ignore_cloud_water = true  # harness GATE=0: solve finite TOA; pooling/support reject bad pixels
surface_driven_aod_clean = 0.15
surface_driven_aod_high = 0.6
# Native-6S Path A switch (heavy, not the measured LUT default above):
# set [algorithms.rt].backend = "sixs", then enable the 3 nearest CCI species.
surface_driven_aerosol_species = "none"  # "cci_climatology" for native 6S + CCI species
surface_driven_aerosol_species_candidates = 3

[output.defaults]
format = "cog"
include_rgb = true
include_uncertainty = true
include_auxiliary = true
