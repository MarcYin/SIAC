# Canonical SIAC system configuration example.
# This file is for stable machine/project settings only.
# Keep per-run inputs such as AOI, input scenes, and output paths out of this file.

[paths]
dem = "/vsicurl/https://raw.githubusercontent.com/MarcYin/Copernicus_GLO_30_DEM_VRT/refs/heads/main/copernicus_GLO_30_dem.vrt"
emulator_dir = "/data/siac/emulators"
lut_path = "s3://bucket/siac/lut.zarr"
spectral_library_root = "/data/siac/spectral-library"
rsrf_root = "/data/siac/RSRF"
cache_root = "/data/siac/cache"

[paths.caches]
s2 = "/data/siac/cache/s2"
spectral_mapping = "/data/siac/cache/spectral-mapping"

[runtime]
log_level = "INFO"
n_jobs = -1
chunk_size = 2048

[runtime.execution]
backend = "thread"
max_workers = 4
retries = 2

[providers.atmo]
kind = "cams"
download_missing = true

[providers.brdf]
kind = "mcd43"
temporal_window = 16

[providers.s2]
backend = "cdse"
cache_dir = "/data/siac/cache/s2"
max_cloud_cover = 40.0
processing_level = "L1C"

[algorithms.cloud_mask]
mode = "auto"
provider = "omnicloudmask"
target_resolution_m = 10.0

[algorithms.surface_prior]
method = "whittaker"
whittaker_lambda = 10.0

[algorithms.surface_prior.spectral_mapping]
enabled = true
k_neighbors = 5

[algorithms.rt]
backend = "emulator"
fallback_to_lut = true

[algorithms.solver]
aot_gamma = 10.0
tcwv_gamma = 5.0

[auth.cdse]
username = "your-cdse-username"
password = "your-cdse-password"

[auth.earthdata]
username = "your-earthdata-username"
password = "your-earthdata-password"

[auth.cds]
api_key = "uid:key"

[output.defaults]
format = "cog"
include_rgb = true
include_uncertainty = true
