name: CI

on:
  push:
    branches:
      - master
      - feat/refactor
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Install environment
        run: pixi install

      - name: Build Rust extension
        run: pixi run build-rust

      - name: Lint
        run: pixi run lint

      - name: Scoped type check
        run: pixi run typecheck-scoped

      - name: Unit tests
        run: pixi run test-no-cov

      - name: Integration slice
        run: |
          pixi run pytest --no-cov \
            tests/integration/test_e2e_synthetic.py \
            tests/integration/test_pipeline.py \
            tests/integration/test_injection.py -q

      - name: Source-tree import smoke
        run: |
          PYTHONPATH=python pixi run python - <<'PY'
          import siac
          import siac._rust
          import siac.sixs_outputs as sixs_outputs

          from siac import SIAC, SIACConfig
          from siac.adapters.output import ConfiguredOutputWriter
          from siac.config.schema import SixSAlgorithmConfig
          from siac.sixs_outputs import SIXS_DEFAULT_OUTPUT_VARIABLES, SIXS_OUTPUT_VARIABLE_CHOICES

          print(siac.__version__)
          print(SIAC.__name__, SIACConfig.__name__, ConfiguredOutputWriter.__name__)
          print(sixs_outputs.__file__)
          assert "xap" in SIXS_DEFAULT_OUTPUT_VARIABLES
          assert len(SIXS_OUTPUT_VARIABLE_CHOICES) >= len(SIXS_DEFAULT_OUTPUT_VARIABLES) >= 3
          assert SixSAlgorithmConfig().output_variables == SIXS_DEFAULT_OUTPUT_VARIABLES
          PY

      - name: Build wheel artifact
        run: pixi run maturin build --release --manifest-path src/siac_rs/Cargo.toml --out dist

      - name: Wheel install smoke (fast)
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(ls dist/siac-*.whl)"
          ls -lh "$wheel"

          smoke_dir="$(mktemp -d)"
          pixi run python -m venv --system-site-packages "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          "$smoke_dir/venv/bin/python" -m pip install --force-reinstall --no-deps "$wheel"

          cd "$smoke_dir"
          "$smoke_dir/venv/bin/siac" --version
          "$smoke_dir/venv/bin/python" - <<'PY'
          import siac
          import siac._rust
          import siac.sixs_outputs as sixs_outputs

          from siac import SIAC, SIACConfig
          from siac.adapters.output import ConfiguredOutputWriter
          from siac.config.schema import SixSAlgorithmConfig
          from siac.sixs_outputs import SIXS_DEFAULT_OUTPUT_VARIABLES, SIXS_OUTPUT_VARIABLE_CHOICES

          print(siac.__version__)
          print(SIAC.__name__, SIACConfig.__name__, ConfiguredOutputWriter.__name__)
          print(sixs_outputs.__file__)
          assert "xap" in SIXS_DEFAULT_OUTPUT_VARIABLES
          assert len(SIXS_OUTPUT_VARIABLE_CHOICES) >= len(SIXS_DEFAULT_OUTPUT_VARIABLES) >= 3
          assert SixSAlgorithmConfig().output_variables == SIXS_DEFAULT_OUTPUT_VARIABLES
          PY

      - name: Wheel install smoke (isolated)
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(ls dist/siac-*.whl)"
          ls -lh "$wheel"

          smoke_dir="$(mktemp -d)"
          pixi run python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          "$smoke_dir/venv/bin/python" -m pip install "$wheel"
          "$smoke_dir/venv/bin/python" -m pip check

          cd "$smoke_dir"
          "$smoke_dir/venv/bin/siac" --version
          "$smoke_dir/venv/bin/python" - <<'PY'
          import siac
          import siac._rust
          import siac.sixs_outputs as sixs_outputs

          from siac import SIAC, SIACConfig
          from siac.adapters.output import ConfiguredOutputWriter
          from siac.config.schema import SixSAlgorithmConfig
          from siac.sixs_outputs import SIXS_DEFAULT_OUTPUT_VARIABLES, SIXS_OUTPUT_VARIABLE_CHOICES

          print(siac.__version__)
          print(SIAC.__name__, SIACConfig.__name__, ConfiguredOutputWriter.__name__)
          print(sixs_outputs.__file__)
          assert "xap" in SIXS_DEFAULT_OUTPUT_VARIABLES
          assert len(SIXS_OUTPUT_VARIABLE_CHOICES) >= len(SIXS_DEFAULT_OUTPUT_VARIABLES) >= 3
          assert SixSAlgorithmConfig().output_variables == SIXS_DEFAULT_OUTPUT_VARIABLES
          PY
