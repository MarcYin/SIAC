name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Install environment
        run: pixi install

      - name: Lint
        run: pixi run lint

      - name: Scoped type check
        run: pixi run typecheck-scoped

      - name: Unit tests
        run: pixi run test-no-cov

      - name: Build Rust extension
        run: pixi run build-rust

      - name: Import smoke
        run: |
          PYTHONPATH=python pixi run python - <<'PY'
          import siac
          import siac._rust

          from siac import SIAC, SIACConfig

          print(siac.__version__)
          print(SIAC.__name__, SIACConfig.__name__)
          PY
