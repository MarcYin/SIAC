name: Live Public Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: live-public-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-network-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Install environment
        run: pixi install

      - name: Run public live smoke tests
        run: pixi run test-live-public
