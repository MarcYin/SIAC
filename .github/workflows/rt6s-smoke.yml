name: Native 6S Smoke

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - master
      - feat/refactor
    paths:
      - ".github/workflows/rt6s-smoke.yml"
      - "python/siac/algorithms/rt/direct/**"
      - "python/siac/config/schema.py"
      - "python/siac/sixs_outputs.py"
      - "tools/build_6s_native.py"
      - "tools/rt6s_smoke.py"
      - "tests/unit/test_sixs_native.py"
      - "tests/integration/test_sixs_backend_integration.py"
  pull_request:
    paths:
      - ".github/workflows/rt6s-smoke.yml"
      - "python/siac/algorithms/rt/direct/**"
      - "python/siac/config/schema.py"
      - "python/siac/sixs_outputs.py"
      - "tools/build_6s_native.py"
      - "tools/rt6s_smoke.py"
      - "tests/unit/test_sixs_native.py"
      - "tests/integration/test_sixs_backend_integration.py"
  workflow_dispatch:

concurrency:
  group: rt6s-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-6s-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Install rt6s environment
        run: pixi install -e rt6s

      - name: Inspect rt6s toolchain
        run: |
          pixi run -e rt6s python - <<'PY'
          import sys
          import numpy
          import setuptools
          from numpy.f2py.f2py2e import MESON_ONLY_VER
          print("python", sys.version)
          print("numpy", numpy.__version__)
          print("setuptools", setuptools.__version__)
          print("MESON_ONLY_VER", MESON_ONLY_VER)
          PY

      - name: Fetch upstream 6S source
        run: |
          set -euo pipefail
          mkdir -p tmp
          if ! curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://salsa.umd.edu/files/6S/6sV2.1.tar" \
            --output tmp/6sV2.1.tar; then
            echo "Retrying 6S fetch with relaxed TLS verification" >&2
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --insecure \
              "https://salsa.umd.edu/files/6S/6sV2.1.tar" \
              --output tmp/6sV2.1.tar
          fi
          rm -rf tmp/6s_upstream
          mkdir -p tmp/6s_upstream
          tar -xf tmp/6sV2.1.tar -C tmp/6s_upstream

      - name: Build and run native 6S smoke
        id: smoke
        continue-on-error: true
        run: SIAC_SIXS_F2PY_BACKEND=meson,distutils PYTHONUNBUFFERED=1 PYTHONPATH=python pixi run -e rt6s python tools/rt6s_smoke.py

      - name: Summarize native 6S diagnostics
        if: steps.smoke.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "Native 6S smoke failed. Available diagnostics:"
          find tmp/rt6s_ci_smoke -maxdepth 4 -type f | sort || true
          for file in \
            tmp/rt6s_ci_smoke/diagnostics/smoke_failure_summary.txt \
            tmp/rt6s_ci_smoke/diagnostics/smoke_traceback.txt \
            tmp/rt6s_ci_smoke/diagnostics/build_failure_summary.txt \
            tmp/rt6s_ci_smoke/diagnostics/f2py-meson.summary.txt \
            tmp/rt6s_ci_smoke/diagnostics/f2py-meson.stderr.txt \
            tmp/rt6s_ci_smoke/diagnostics/f2py-meson.stdout.txt \
            tmp/rt6s_ci_smoke/diagnostics/f2py-distutils.summary.txt \
            tmp/rt6s_ci_smoke/diagnostics/f2py-distutils.stderr.txt \
            tmp/rt6s_ci_smoke/diagnostics/f2py-distutils.stdout.txt \
            tmp/rt6s_ci_smoke/diagnostics/build_tree.txt \
            tmp/rt6s_ci_smoke/diagnostics/module_candidates.txt; do
            if [ -f "$file" ]; then
              echo "::group::$file"
              tail -n 200 "$file" || true
              echo "::endgroup::"
            fi
          done

      - name: Upload native 6S smoke diagnostics
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: native-6s-smoke-diagnostics-${{ github.run_id }}
          path: tmp/rt6s_ci_smoke
          if-no-files-found: ignore

      - name: Fail workflow if smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
